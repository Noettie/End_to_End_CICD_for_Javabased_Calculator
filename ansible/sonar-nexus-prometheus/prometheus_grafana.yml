---
- name: Install Prometheus and Grafana
  hosts: prometheus_grafana
  become: yes
  vars:
    prometheus_version: "2.44.0"
    grafana_version: "9.4.7"

  tasks:
    - name: Create prometheus user
      user:
        name: prometheus
        system: yes
        shell: /bin/bash

    - name: Download Prometheus tarball
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp/prometheus.tar.gz

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /opt/
        remote_src: yes
        creates: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"

    - name: Symlink Prometheus
      file:
        src: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"
        dest: /opt/prometheus
        state: link

    - name: Change ownership of Prometheus files
      file:
        path: /opt/prometheus
        state: directory
        recurse: yes
        owner: prometheus
        group: prometheus

    - name: Create systemd service for Prometheus
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          ExecStart=/opt/prometheus/prometheus \
            --config.file=/opt/prometheus/prometheus.yml \
            --storage.tsdb.path=/opt/prometheus/data

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd

    - name: Create prometheus config file
      copy:
        dest: /opt/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        enabled: yes
        state: started

    # Grafana installation from official repo
    - name: Install yum-utils
      yum:
        name: yum-utils
        state: present

    - name: Add Grafana repo
      yum_repository:
        name: grafana
        description: Grafana Repository
        baseurl: https://packages.grafana.com/oss/rpm
        gpgcheck: yes
        gpgkey: https://packages.grafana.com/gpg.key
        enabled: yes

    - name: Install Grafana
      yum:
        name: grafana
        state: present

    - name: Enable and start Grafana
      systemd:
        name: grafana-server
        enabled: yes
        state: started

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload

