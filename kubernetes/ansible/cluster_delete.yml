---
- name: Delete KOPS Cluster
  hosts: localhost
  gather_facts: no
  vars_files:
    - vars.yml

  tasks:
    - name: Delete cluster using kops
      shell: |
        export KOPS_STATE_STORE={{ state_store }}
        kops delete cluster --name={{ cluster_name }} --yes
      register: kops_delete_output

    - name: Show deletion result
      debug:
        var: kops_delete_output.stdout_lines

